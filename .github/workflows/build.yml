name: Build

# Build a wheel/sdist for every commit pushed to any branch and attach it to
# a pre-release tagged `build-<short-sha>`, so any commit stays downloadable.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set dev version
        env:
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          base="$(uv version --short)"
          short="${SHA:0:7}"
          # PEP 440: 0.1.0.dev42+gabc1234 — distinct per commit, installable
          # side by side with released versions.
          uv version "${base}.dev${RUN_NUMBER}+g${short}" --no-sync
          echo "SHORT=${short}" >> "$GITHUB_ENV"

      - name: Build sdist and wheel
        run: uv build

      - name: Check the wheel contents
        run: |
          uv run --isolated --no-project --with dist/*.whl python -c \
            "import layui_anywidget; print(layui_anywidget.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ env.SHORT }}
          path: dist/

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${SHORT}"
          title="Development build ${SHORT}"
          notes="Automated build of ${GITHUB_SHA} from ${GITHUB_REF_NAME}."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --title "$title" --notes "$notes" --prerelease
          fi
