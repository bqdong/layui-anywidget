[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "layui-anywidget"
version = "0.1.0"
description = "layui components for anywidget, usable from Jupyter and marimo"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["anywidget", "jupyter", "layui", "marimo", "widgets"]
dependencies = [
    "anywidget>=0.11.0",
    "traitlets>=5.14",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Jupyter",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "ruff>=0.6",
]
demo = ["marimo>=0.10"]
browser = ["playwright>=1.40"]

[tool.hatch.build.targets.wheel]
packages = ["layui_anywidget"]

[tool.hatch.build]
artifacts = [
    "layui_anywidget/static/*.js",
    "layui_anywidget/static/*.css",
    "layui_anywidget/static/vendor/*",
]

[dependency-groups]
dev = [
    "layui-anywidget[test,demo,browser]",
    "prek>=0.5",
    "ruff>=0.6",
]

[tool.uv]
# The demo/browser extras pull in heavy wheels (marimo, playwright); tests
# only need the test extra.
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# A002 (shadowing builtins) is deliberate: layui option names like `type`,
# `format`, `range` and `id` are part of the public API.
ignore = ["A002"]

[tool.ruff.lint.isort]
known-first-party = ["layui_anywidget"]

[tool.ruff.lint.per-file-ignores]
# Demos contain Chinese UI text; full-width punctuation is intentional.
"demos/*" = ["RUF001", "RUF002", "RUF003"]
